{# Shared admin sub-navigation. #}
{# Requires `active_tab` variable in context (e.g., "users", "reports"). #}
<nav class="mb-6 flex gap-4 border-b border-gray-300 pb-2 text-sm">
  <a href="/admin/reports"
     class="{% if active_tab == 'reports' %}font-bold underline text-blue-900{% else %}font-medium text-gray-600 hover:text-blue-900{% endif %}">Reports</a>
  <a href="/admin/users"
     class="{% if active_tab == 'users' %}font-bold underline text-blue-900{% else %}font-medium text-gray-600 hover:text-blue-900{% endif %}">Users</a>
</nav>
