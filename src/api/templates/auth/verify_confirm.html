{% extends "base_auth.html" %}

{% block title %}Confirm Login — Baseball Stats{% endblock %}

{% block content %}
<div class="min-h-screen flex items-start justify-center pt-16 px-4">
  <div class="w-full max-w-sm text-center">
    <div class="mb-6 text-5xl">&#x1f510;</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-3">Confirm your login</h1>
    <p class="text-gray-600 mb-6">
      Click the button below to finish logging in to Baseball Stats.
    </p>
    <form method="post" action="/auth/verify" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <input type="hidden" name="token" value="{{ token }}">
      <button
        type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 px-4 rounded-lg text-base transition-colors"
      >
        Log in
      </button>
    </form>
  </div>
</div>
{% endblock %}
