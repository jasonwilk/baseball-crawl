<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Baseball Reports{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <nav class="bg-blue-900 text-white px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center">
      <span class="font-bold text-lg">Baseball Stats</span>
      <div class="ml-auto flex items-center gap-4 text-sm">
        <a href="/admin/reports" class="text-blue-200 hover:text-white">Admin</a>
        {% block header_extras %}{% endblock %}
      </div>
    </div>
  </nav>
  <main class="p-4 max-w-4xl mx-auto pb-16">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
